# ===================================================================
# Application Name
# ===================================================================
spring.application.name=lms-backend
# ===================================================================
# Database Connection (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_lms
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Settings
# ===================================================================
# Automatically updates the database schema based on your Entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures Hibernate uses the optimized PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

